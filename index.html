<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>specificity in css</title>
    <style>
        /* the specificity of this selector is 1 */
        h1 {
            color: rgb(255, 0, 204);
        }

        /* the specificity of this selector is 10 */
        h1.yellow {
            color: yellow;
        }

        /* the specificity of this selector is 10 */
        .cpurple {
            color: purple;
        }
        
        /* the specificity of this selector is 10 */
        .cred {
            color: red;
        }
        
        /* the specificity of this selector is 10 */
        /* attribute selector === (data-x=a) */
        [data-x=a] {
            color: blue;
            background-color: burlywood;
        }
    </style>
</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">
            css-specificity
        </h1>
    </div>
</body>

</html>
